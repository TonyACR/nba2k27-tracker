<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload partita | NBA 2K27 Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

<header class="border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-xl font-black">
            NBA<span class="text-blue-500">2K</span>
        </a>

        <div class="flex items-center gap-4">
            <a href="index.html" class="text-slate-400 hover:text-white font-medium text-sm">Dashboard</a>
            <button id="logoutButton" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-semibold text-sm">
                Logout
            </button>
        </div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-6 py-12">

    <div class="mb-8">
        <h1 class="text-3xl font-black">
            Carica partita
        </h1>
        <p class="text-slate-400 mt-2">
            Estrattore statistiche basato su <strong>Llama 3.2 Vision AI (Groq)</strong>.
        </p>
    </div>

    <div class="mb-6 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
        <label for="apiKeyInput" class="block text-sm font-semibold mb-2">
            Groq API Key (Llama 3.2 Vision)
        </label>
        <div class="flex gap-3">
            <input
                id="apiKeyInput"
                type="password"
                placeholder="Incolla la tua Groq Key (es. gsk_...)"
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-blue-500 outline-none">
            <button
                id="saveKeyBtn"
                class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl font-semibold text-sm transition">
                Salva Key
            </button>
        </div>
        <p class="text-xs text-slate-500 mt-2">
            Ottieni la chiave gratuita su <a href="https://console.groq.com/" target="_blank" class="text-blue-400 underline">console.groq.com</a>. La chiave rimarrà salvata sul tuo dispositivo.
        </p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
        <label for="screenshot" class="block text-sm font-semibold mb-3">
            Screenshot Box Score / Rec NBA 2K
        </label>

        <input
            id="screenshot"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            class="block w-full text-sm text-slate-300
                   file:mr-4 file:py-2 file:px-4
                   file:rounded-lg file:border-0
                   file:bg-blue-600 file:text-white
                   hover:file:bg-blue-500 transition cursor-pointer">

        <button
            id="analyzeButton"
            class="mt-6 w-full bg-blue-600 hover:bg-blue-500
                   rounded-xl py-3 font-bold transition flex items-center justify-center gap-2">
            <span id="btnText">Analizza con Llama 3.2 Vision AI</span>
        </button>

        <div id="message" class="hidden mt-5 rounded-xl px-4 py-3 text-sm"></div>
    </div>

    <div id="resultContainer" class="hidden mt-8">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
            <div class="flex justify-between items-center mb-5">
                <div>
                    <h2 class="text-xl font-bold">Giocatori Estratti da Llama AI</h2>
                    <p class="text-xs text-slate-400">Verifica o correggi le statistiche prima del salvataggio</p>
                </div>
                <button id="addPlayerBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 px-3 py-1.5 rounded-lg border border-slate-700 font-semibold">
                    + Aggiungi Giocatore
                </button>
            </div>

            <div id="playersContainer" class="space-y-4"></div>

            <button
                id="saveButton"
                class="mt-8 w-full bg-green-600 hover:bg-green-500 rounded-xl py-3 font-bold transition">
                Salva partita su Supabase
            </button>
        </div>
    </div>

</main>

<script type="module">
import { supabase } from "./js/supabase.js";

const screenshotInput = document.getElementById("screenshot");
const analyzeButton = document.getElementById("analyzeButton");
const btnText = document.getElementById("btnText");
const saveButton = document.getElementById("saveButton");
const addPlayerBtn = document.getElementById("addPlayerBtn");
const message = document.getElementById("message");
const resultContainer = document.getElementById("resultContainer");
const playersContainer = document.getElementById("playersContainer");

const apiKeyInput = document.getElementById("apiKeyInput");
const saveKeyBtn = document.getElementById("saveKeyBtn");

let rawOcrText = "";

// Carica API Key salvata nel localStorage
apiKeyInput.value = localStorage.getItem("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") || "";

saveKeyBtn.addEventListener("click", () => {
    const key = apiKeyInput.value.trim();
    if (!key) {
        showMessage("Inserisci una Groq API Key valida.", "error");
        return;
    }
    localStorage.setItem("GROQ_API_KEY", key);
    showMessage("Groq API Key salvata nel browser!", "success");
});

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
    });
}

// GESTIONE MESSAGGI DI NOTIFICA
function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "mt-5 rounded-xl px-4 py-3 text-sm border";

    if (type === "success") {
        message.classList.add("bg-green-500/10", "border-green-500/20", "text-green-400");
    } else if (type === "info") {
        message.classList.add("bg-blue-500/10", "border-blue-500/20", "text-blue-400");
    } else {
        message.classList.add("bg-red-500/10", "border-red-500/20", "text-red-400");
    }
}

// CHECK AUTENTICAZIONE SUPABASE
async function checkUser() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
        window.location.href = "login.html";
        return null;
    }
    return user;
}

// CHIAMATA API A GROQ (LLAMA 3.2 VISION)
analyzeButton.addEventListener("click", async () => {
    const file = screenshotInput.files[0];
    const apiKey = apiKeyInput.value.trim() || localStorage.getItem("GROQ_API_KEY");

    if (!apiKey) {
        showMessage("Inserisci e salva prima la tua Groq API Key.", "error");
        return;
    }

    if (!file) {
        showMessage("Seleziona prima uno screenshot.");
        return;
    }

    analyzeButton.disabled = true;
    btnText.textContent = "Elaborazione con Llama 3.2 Vision...";
    message.classList.add("hidden");

    try {
        const base64Image = await fileToBase64(file);

        const prompt = `Sei un sistema esperto di OCR visivo per il videogioco NBA 2K. 
Analizza l'immagine del box score fornita ed estrai tutti i giocatori visibili con le loro statistiche.
Restituisci ESCLUSIVAMENTE un array JSON valido senza alcun blocco markdown, note o spiegazioni, seguendo esattamente questa struttura:
[
  {
    "name": "NomeGiocatore",
    "pts": 20,
    "reb": 5,
    "ast": 8,
    "stl": 2,
    "blk": 1,
    "grade": "A+"
  }
]`;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.2-11b-vision-preview",
                messages: [
                    {
                        role: "user",
                        content: [
                            { type: "text", text: prompt },
                            { type: "image_url", image_url: { url: base64Image } }
                        ]
                    }
                ],
                temperature: 0.1
            })
        });

        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `Errore HTTP ${response.status}`);
        }

        const data = await response.json();
        rawOcrText = data.choices?.[0]?.message?.content || "";

        console.log("Risposta Groq Vision:", rawOcrText);

        // Pulizia eventuale formattazione markdown ```json
        let cleanJsonText = rawOcrText
            .replace(/```json/g, '')
            .replace(/```/g, '')
            .trim();

        let players = [];
        try {
            players = JSON.parse(cleanJsonText);
        } catch (jsonErr) {
            console.warn("Parsing JSON diretto fallito, cerco l'array nel testo...", jsonErr);
            const match = cleanJsonText.match(/\[\s*\{.*\}\s*\]/s);
            if (match) {
                players = JSON.parse(match[0]);
            } else {
                throw new Error("Impossibile interpretare i dati restituiti dall'AI. Riprova.");
            }
        }

        if (!Array.isArray(players) || players.length === 0) {
            players = [{ name: "Giocatore 1", pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, grade: "-" }];
        }

        displayPlayers(players);
        showMessage("Analisi completata con successo con Llama 3.2 Vision!", "success");

    } catch (error) {
        console.error("Errore Groq Vision:", error);
        showMessage("Errore nell'estrazione: " + error.message, "error");
    }

    analyzeButton.disabled = false;
    btnText.textContent = "Analizza con Llama 3.2 Vision AI";
});

// GENERAZIONE SCHEDE GIOCATORI EDITABILI
function displayPlayers(players) {
    playersContainer.innerHTML = "";
    players.forEach(p => addPlayerCard(p));
    resultContainer.classList.remove("hidden");
}

function addPlayerCard(player = { name: "", pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, grade: "-" }) {
    const card = document.createElement("div");
    card.className = "player-card bg-slate-800 rounded-xl p-4 border border-slate-700/50 space-y-3 shadow-md";

    card.innerHTML = `
        <div class="flex justify-between items-center gap-2">
            <input type="text" value="${escapeHTML(player.name)}" placeholder="Nickname Giocatore"
                class="p-name bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 font-bold text-white w-full max-w-xs focus:border-blue-500 outline-none text-sm">
            
            <div class="flex items-center gap-1">
                <span class="text-xs text-slate-400 font-medium">Voto:</span>
                <input type="text" value="${escapeHTML(player.grade)}" placeholder="A+"
                    class="p-grade bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 font-black text-blue-400 w-14 text-center focus:border-blue-500 outline-none text-sm">
            </div>

            <button type="button" class="remove-btn text-red-400 hover:text-red-300 font-bold px-2 py-1 text-sm">
                ✕
            </button>
        </div>

        <div class="grid grid-cols-5 gap-2 text-center text-xs">
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">PTS</label>
                <input type="number" min="0" value="${player.pts ?? 0}" class="p-pts w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">REB</label>
                <input type="number" min="0" value="${player.reb ?? 0}" class="p-reb w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">AST</label>
                <input type="number" min="0" value="${player.ast ?? 0}" class="p-ast w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">STL</label>
                <input type="number" min="0" value="${player.stl ?? 0}" class="p-stl w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">BLK</label>
                <input type="number" min="0" value="${player.blk ?? 0}" class="p-blk w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
        </div>
    `;

    card.querySelector(".remove-btn").addEventListener("click", () => card.remove());
    playersContainer.appendChild(card);
}

addPlayerBtn.addEventListener("click", () => addPlayerCard());

// SALVATAGGIO IN SUPABASE
saveButton.addEventListener("click", async () => {
    const user = await checkUser();
    if (!user) return;

    const cards = playersContainer.querySelectorAll(".player-card");
    if (cards.length === 0) {
        showMessage("Aggiungi almeno un giocatore prima di salvare.");
        return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Salvataggio su Supabase...";

    try {
        const { data: match, error: matchError } = await supabase
            .from("nba_matches")
            .insert({
                user_id: user.id,
                ocr_raw_text: rawOcrText || "Analisi Llama 3.2 Vision Groq"
            })
            .select()
            .single();

        if (matchError) throw matchError;

        const playersData = [];
        cards.forEach(card => {
            playersData.push({
                match_id: match.id,
                user_id: user.id,
                player_name: card.querySelector(".p-name").value.trim() || "Sconosciuto",
                grade: card.querySelector(".p-grade").value.trim() || null,
                pts: parseInt(card.querySelector(".p-pts").value) || 0,
                reb: parseInt(card.querySelector(".p-reb").value) || 0,
                ast: parseInt(card.querySelector(".p-ast").value) || 0,
                stl: parseInt(card.querySelector(".p-stl").value) || 0,
                blk: parseInt(card.querySelector(".p-blk").value) || 0
            });
        });

        const { error: playersError } = await supabase
            .from("nba_match_players")
            .insert(playersData);

        if (playersError) throw playersError;

        showMessage("Partita salvata con successo!", "success");
        saveButton.textContent = "Salvata ✓";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {
        console.error(error);
        showMessage("Errore durante il salvataggio: " + error.message);
        saveButton.disabled = false;
        saveButton.textContent = "Salva partita su Supabase";
    }
});

// LOGOUT
document.getElementById("logoutButton").addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.href = "login.html";
});

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

checkUser();
</script>

</body>
</html>
