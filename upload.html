<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload partita | NBA 2K27 Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

<header class="border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-xl font-black">
            NBA<span class="text-blue-500">2K</span>
        </a>

        <div class="flex items-center gap-4">
            <a href="index.html" class="text-slate-400 hover:text-white font-medium text-sm">Dashboard</a>
            <button id="logoutButton" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-semibold text-sm">
                Logout
            </button>
        </div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-6 py-12">

    <div class="mb-8">
        <h1 class="text-3xl font-black">
            Carica partita
        </h1>
        <p class="text-slate-400 mt-2">
            Carica lo screenshot GAME STATS / Rec della tua partita NBA 2K.
        </p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
        <label for="screenshot" class="block text-sm font-semibold mb-3">
            Screenshot Box Score / Rec
        </label>

        <input
            id="screenshot"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            class="block w-full text-sm text-slate-300
                   file:mr-4 file:py-2 file:px-4
                   file:rounded-lg file:border-0
                   file:bg-blue-600 file:text-white
                   hover:file:bg-blue-500 transition cursor-pointer">

        <button
            id="analyzeButton"
            class="mt-6 w-full bg-blue-600 hover:bg-blue-500
                   rounded-xl py-3 font-bold transition flex items-center justify-center gap-2">
            <span id="btnText">Analizza screenshot con baidu/Unlimited-OCR (AI)</span>
        </button>

        <div id="message" class="hidden mt-5 rounded-xl px-4 py-3 text-sm"></div>
    </div>

    <div id="resultContainer" class="hidden mt-8">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
            <div class="flex justify-between items-center mb-5">
                <div>
                    <h2 class="text-xl font-bold">Giocatori e Statistiche Rilevati</h2>
                    <p class="text-xs text-slate-400">Verifica o modifica i dati estratti prima di salvare</p>
                </div>
                <button id="addPlayerBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 px-3 py-1.5 rounded-lg border border-slate-700 font-semibold">
                    + Aggiungi Giocatore
                </button>
            </div>

            <div id="playersContainer" class="space-y-4"></div>

            <button
                id="saveButton"
                class="mt-8 w-full bg-green-600 hover:bg-green-500 rounded-xl py-3 font-bold transition">
                Salva partita su Supabase
            </button>
        </div>
    </div>

</main>

<script type="module">
import { supabase } from "./js/supabase.js";
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";

const screenshotInput = document.getElementById("screenshot");
const analyzeButton = document.getElementById("analyzeButton");
const btnText = document.getElementById("btnText");
const saveButton = document.getElementById("saveButton");
const addPlayerBtn = document.getElementById("addPlayerBtn");
const message = document.getElementById("message");
const resultContainer = document.getElementById("resultContainer");
const playersContainer = document.getElementById("playersContainer");

let rawOcrText = "";

// Helper: Converti il file locale in stringa Base64 Data URL
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
    });
}

// MESSAGGI
function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "mt-5 rounded-xl px-4 py-3 text-sm border";

    if (type === "success") {
        message.classList.add("bg-green-500/10", "border-green-500/20", "text-green-400");
    } else if (type === "info") {
        message.classList.add("bg-blue-500/10", "border-blue-500/20", "text-blue-400");
    } else {
        message.classList.add("bg-red-500/10", "border-red-500/20", "text-red-400");
    }
}

// CHECK USER AUTH
async function checkUser() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
        window.location.href = "login.html";
        return null;
    }
    return user;
}

// PARSER PER TESTO E TABELLE MARKDOWN RESTITUITE DA BAIDU UNLIMITED-OCR
function parse2KBoxScore(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const players = [];

    const gradeRegex = /\b(A\+|A-|A|B\+|B-|B|C\+|C-|C|D\+|D-|D|F)\b/i;

    lines.forEach(line => {
        // Ignora intestazioni
        if (line.toUpperCase().includes('PTS') && line.toUpperCase().includes('REB')) return;
        if (line.includes('---')) return;

        // Caso 1: Tabella Markdown (| Player | PTS | REB | ...)
        if (line.includes('|')) {
            const parts = line.split('|').map(p => p.trim()).filter(p => p.length > 0);
            if (parts.length >= 2) {
                const name = parts[0];
                const nums = [];
                let grade = "-";

                for (let i = 1; i < parts.length; i++) {
                    const gMatch = parts[i].match(gradeRegex);
                    if (gMatch && grade === "-") {
                        grade = gMatch[0].toUpperCase();
                    } else {
                        const num = parseInt(parts[i].replace(/\D/g, ''));
                        if (!isNaN(num)) {
                            nums.push(num);
                        }
                    }
                }

                if (name && nums.length >= 1) {
                    players.push({
                        name: name,
                        pts: nums[0] ?? 0,
                        reb: nums[1] ?? 0,
                        ast: nums[2] ?? 0,
                        stl: nums[3] ?? 0,
                        blk: nums[4] ?? 0,
                        grade: grade
                    });
                }
            }
        } else {
            // Caso 2: Riga di testo semplice
            const numbers = line.match(/\b\d+\b/g);
            if (numbers && numbers.length >= 2) {
                const gradeMatch = line.match(gradeRegex);
                const grade = gradeMatch ? gradeMatch[0].toUpperCase() : "-";

                let name = line
                    .replace(gradeRegex, '')
                    .replace(/\b\d+\b/g, '')
                    .replace(/[^a-zA-Z0-9_\-\s]/g, '')
                    .trim();

                if (!name || name.length < 2) {
                    name = "Giocatore " + (players.length + 1);
                }

                players.push({
                    name: name,
                    pts: parseInt(numbers[0]) || 0,
                    reb: parseInt(numbers[1]) || 0,
                    ast: parseInt(numbers[2]) || 0,
                    stl: numbers[3] ? parseInt(numbers[3]) : 0,
                    blk: numbers[4] ? parseInt(numbers[4]) : 0,
                    grade: grade
                });
            }
        }
    });

    return players;
}

// ANALISI OCR TRAMITE HUGGING FACE (baidu/Unlimited-OCR)
analyzeButton.addEventListener("click", async () => {
    const file = screenshotInput.files[0];
    if (!file) {
        showMessage("Seleziona prima uno screenshot.");
        return;
    }

    analyzeButton.disabled = true;
    btnText.textContent = "Connessione a baidu/Unlimited-OCR (AI)...";
    showMessage("Connessione ad Hugging Face... Se il modello era in riposo, l'avvio potrebbe richiedere 15-20 secondi.", "info");

    try {
        // 1. Converti file in Base64 Data URL (risolve l'errore "Invalid URL")
        const base64Image = await fileToBase64(file);

        // 2. Connettiti allo space baidu/Unlimited-OCR
        const client = await Client.connect("baidu/Unlimited-OCR");

        btnText.textContent = "Elaborazione immagine in corso...";

        // 3. Chiamata all'endpoint
        let result;
        try {
            result = await client.predict("/predict", [
                base64Image,
                "document parsing."
            ]);
        } catch (errPositional) {
            console.warn("Chiamata posizionale fallita, provo con parametri con nome...", errPositional);
            result = await client.predict("/predict", {
                image: base64Image,
                task_prompt: "document parsing."
            });
        }

        console.log("Risposta baidu/Unlimited-OCR:", result);

        rawOcrText = Array.isArray(result.data) ? result.data.join("\n") : String(result.data || "");

        if (!rawOcrText || rawOcrText.trim().length === 0) {
            throw new Error("Nessun testo estratto dall'immagine.");
        }

        const players = parse2KBoxScore(rawOcrText);

        if (players.length === 0) {
            players.push({ name: "Giocatore 1", pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, grade: "A+" });
        }

        displayPlayers(players);
        showMessage("Estratto con successo tramite baidu/Unlimited-OCR!", "success");

    } catch (error) {
        console.error("Errore HF OCR:", error);
        showMessage("Errore nell'estrazione: " + error.message, "error");
    }

    analyzeButton.disabled = false;
    btnText.textContent = "Analizza screenshot con baidu/Unlimited-OCR (AI)";
});

// RENDERING SCHEDE GIOCATORI MODIFICABILI
function displayPlayers(players) {
    playersContainer.innerHTML = "";
    players.forEach(p => addPlayerCard(p));
    resultContainer.classList.remove("hidden");
}

function addPlayerCard(player = { name: "", pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, grade: "-" }) {
    const card = document.createElement("div");
    card.className = "player-card bg-slate-800 rounded-xl p-4 border border-slate-700/50 space-y-3 shadow-md";

    card.innerHTML = `
        <div class="flex justify-between items-center gap-2">
            <input type="text" value="${escapeHTML(player.name)}" placeholder="Nickname Giocatore"
                class="p-name bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 font-bold text-white w-full max-w-xs focus:border-blue-500 outline-none text-sm">
            
            <div class="flex items-center gap-1">
                <span class="text-xs text-slate-400 font-medium">Voto:</span>
                <input type="text" value="${escapeHTML(player.grade)}" placeholder="A+"
                    class="p-grade bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 font-black text-blue-400 w-14 text-center focus:border-blue-500 outline-none text-sm">
            </div>

            <button type="button" class="remove-btn text-red-400 hover:text-red-300 font-bold px-2 py-1 text-sm">
                ✕
            </button>
        </div>

        <div class="grid grid-cols-5 gap-2 text-center text-xs">
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">PTS</label>
                <input type="number" min="0" value="${player.pts}" class="p-pts w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">REB</label>
                <input type="number" min="0" value="${player.reb}" class="p-reb w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">AST</label>
                <input type="number" min="0" value="${player.ast}" class="p-ast w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">STL</label>
                <input type="number" min="0" value="${player.stl}" class="p-stl w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">BLK</label>
                <input type="number" min="0" value="${player.blk}" class="p-blk w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-center font-bold text-white focus:border-blue-500 outline-none">
            </div>
        </div>
    `;

    card.querySelector(".remove-btn").addEventListener("click", () => card.remove());
    playersContainer.appendChild(card);
}

addPlayerBtn.addEventListener("click", () => addPlayerCard());

// SALVATAGGIO SU SUPABASE
saveButton.addEventListener("click", async () => {
    const user = await checkUser();
    if (!user) return;

    const cards = playersContainer.querySelectorAll(".player-card");
    if (cards.length === 0) {
        showMessage("Aggiungi almeno un giocatore prima di salvare.");
        return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Salvataggio su Supabase...";

    try {
        const { data: match, error: matchError } = await supabase
            .from("nba_matches")
            .insert({
                user_id: user.id,
                ocr_raw_text: rawOcrText || "Analisi baidu/Unlimited-OCR"
            })
            .select()
            .single();

        if (matchError) throw matchError;

        const playersData = [];
        cards.forEach(card => {
            playersData.push({
                match_id: match.id,
                user_id: user.id,
                player_name: card.querySelector(".p-name").value.trim() || "Sconosciuto",
                grade: card.querySelector(".p-grade").value.trim() || null,
                pts: parseInt(card.querySelector(".p-pts").value) || 0,
                reb: parseInt(card.querySelector(".p-reb").value) || 0,
                ast: parseInt(card.querySelector(".p-ast").value) || 0,
                stl: parseInt(card.querySelector(".p-stl").value) || 0,
                blk: parseInt(card.querySelector(".p-blk").value) || 0
            });
        });

        const { error: playersError } = await supabase
            .from("nba_match_players")
            .insert(playersData);

        if (playersError) throw playersError;

        showMessage("Partita salvata con successo!", "success");
        saveButton.textContent = "Salvata ✓";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {
        console.error(error);
        showMessage("Errore durante il salvataggio: " + error.message);
        saveButton.disabled = false;
        saveButton.textContent = "Salva partita su Supabase";
    }
});

// LOGOUT
document.getElementById("logoutButton").addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.href = "login.html";
});

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

checkUser();
</script>

</body>
</html>
