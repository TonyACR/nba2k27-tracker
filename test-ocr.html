<h1>NBA 2K27 Tracker</h1>

<div class="subtitle">

<div class="card">

    <h2>Test GAME STATS</h2>

    <div id="upload" class="upload">

        <div class="icon">📷</div>

        <div class="title">
            Seleziona uno screenshot GAME STATS

            Clicca qui per scegliere l'immagine
        </div>

    </div>

    <input
        id="fileInput"
        type="file"
        accept="image/png,image/jpeg,image/jpg,image/webp"
    >

    <div id="preview">

        <img id="previewImage" alt="NBA 2K Screenshot">

    </div>

        <button
            id="analyze"
            class="primary"
            disabled
        >
            Analizza con Gemini
        </button>

```

</div>

<script>

const upload =
    document.getElementById("upload");

const fileInput =
    document.getElementById("fileInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const analyze =
    document.getElementById("analyze");

const remove =
    document.getElementById("remove");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");

const output =
    document.getElementById("output");

let selectedFile = null;


/* =========================
   UPLOAD
========================= */

upload.addEventListener("click", () => {
    fileInput.click();
});


fileInput.addEventListener("change", () => {

    if (!fileInput.files.length) {
        return;
    }

    selectFile(fileInput.files[0]);

});


function selectFile(file) {

    if (!file.type.startsWith("image/")) {

        showStatus(
            "Seleziona un'immagine.",
            "error"
        );

        return;
    }

    selectedFile = file;

    const reader = new FileReader();

    reader.onload = event => {

        previewImage.src =
            event.target.result;

        preview.style.display =
            "block";

        analyze.disabled =
            false;

        remove.disabled =
            false;

        result.style.display =
            "none";

        hideStatus();

    };

    reader.readAsDataURL(file);
}


/* =========================
   REMOVE
========================= */

remove.addEventListener("click", () => {

    selectedFile = null;

    fileInput.value = "";

    previewImage.src = "";

    preview.style.display =
        "none";

    analyze.disabled =
        true;

    remove.disabled =
        true;

    result.style.display =
        "none";

});


/* =========================
   ANALYZE
========================= */

analyze.addEventListener("click", async () => {

    if (!selectedFile) {
        return;
    }

    analyze.disabled = true;

    showStatus(
        "⏳ Invio screenshot a Gemini...",
        "loading"
    );

    try {

        const base64 =
            await fileToBase64(selectedFile);

        console.log(
            "Invio immagine a /api/ocr"
        );

        const response =
            await fetch(
                "/api/ocr",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        image: base64
                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "Risposta server:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Errore HTTP " +
                response.status
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Gemini non ha restituito un risultato."
            );

        }


        output.value =
            JSON.stringify(
                data.data,
                null,
                2
            );


        result.style.display =
            "block";


        showStatus(
            "✅ OCR completato correttamente!",
            "success"
        );


        result.scrollIntoView({
            behavior: "smooth"
        });


    } catch (error) {

        console.error(error);

        showStatus(
            "❌ " + error.message,
            "error"
        );

    } finally {

        analyze.disabled =
            false;

    }

});


/* =========================
   FILE → BASE64
========================= */

function fileToBase64(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload = () => {

                resolve(
                    reader.result
                );

            };

            reader.onerror = () => {

                reject(
                    new Error(
                        "Impossibile leggere l'immagine."
                    )
                );

            };

            reader.readAsDataURL(file);

        }
    );
}


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type
) {

    status.textContent =
        message;

    status.className =
        "status " +
        type;

}


function hideStatus() {

    status.textContent =
        "";

    status.className =
        "status";

}

</script>
