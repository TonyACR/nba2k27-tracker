<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NBA 2K27 Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center">

    <div class="w-full max-w-md px-6">

        <div class="text-center mb-8">
            <h1 class="text-4xl font-black tracking-tight">
                NBA<span class="text-blue-500">2K</span>
            </h1>

            <p class="text-slate-400 mt-2">
                NBA 2K27 Tracker
            </p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">

            <h2 class="text-2xl font-bold mb-2">
                Bentornato
            </h2>

            <p class="text-slate-400 mb-6">
                Accedi al tuo account
            </p>

            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-slate-300 mb-2">
                    Email
                </label>
                <input
                    id="email"
                    type="email"
                    placeholder="nome@email.com"
                    autocomplete="email"
                    class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500 transition"
                >
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
                    Password
                </label>
                <input
                    id="password"
                    type="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500 transition"
                >
            </div>

            <div id="message" class="hidden mb-4 rounded-xl px-4 py-3 text-sm"></div>

            <button
                id="loginButton"
                class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 transition rounded-xl py-3 font-bold">
                Accedi
            </button>

            <p class="text-center text-slate-400 text-sm mt-6">
                Non hai ancora un account?
                <a href="register.html" class="text-blue-400 hover:text-blue-300 font-semibold">
                    Registrati
                </a>
            </p>

        </div>

    </div>

    <script type="module">
        import { supabase } from "./js/supabase.js";

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.classList.remove("hidden", "bg-red-500/10", "border-red-500/20", "text-red-400", "bg-green-500/10", "border-green-500/20", "text-green-400");

            if (type === "error") {
                message.classList.add("bg-red-500/10", "border", "border-red-500/20", "text-red-400");
            } else {
                message.classList.add("bg-green-500/10", "border", "border-green-500/20", "text-green-400");
            }
        }

        loginButton.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("Inserisci email e password.", "error");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Accesso in corso...";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showMessage(error.message, "error");
                loginButton.disabled = false;
                loginButton.textContent = "Accedi";
                return;
            }

            showMessage("Accesso effettuato!", "success");

            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);
        });
    </script>

</body>
</html>
